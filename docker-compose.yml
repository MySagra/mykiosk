# MyKiosk da solo. Nell'installazione completa usa il docker compose generale,
# che ha lo stesso servizio. Indirizzo del server e URL delle app sono nel .env
# (vedi .env.example).
services:
  mykiosk:
    image: mysagra-mykiosk:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykiosk
    restart: always
    environment:
      - NODE_ENV=production
      # URL mostrati dal kiosk: se vuoti, il pulsante dell'app non compare
      - MYAMMINISTRATORE_URL=${MYAMMINISTRATORE_URL-http://${SERVER_IP}:3030}
      - MYCASSA_URL=${MYCASSA_URL-http://${SERVER_IP}:3031}
      - MYNUMERI_URL=${MYNUMERI_URL-http://${SERVER_IP}:3033}
      - MYCOMANDA_URL=${MYCOMANDA_URL-http://${SERVER_IP}:3035}
      - MYCLIENTI_URL=${MYCLIENTI_URL-http://${SERVER_IP}:3034}
      - KIOSK_CHECK_INTERVAL=${KIOSK_CHECK_INTERVAL:-15}
      # CA locale: serve al controllo di stato per fidarsi degli URL https on-site
      - NODE_EXTRA_CA_CERTS=/app/rootCA.pem
    # Con SERVER_IP=localhost il controllo di stato raggiunge le app
    # sulla macchina host tramite host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rootCA.pem:/app/rootCA.pem:ro
    ports:
      - "3036:3036"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
